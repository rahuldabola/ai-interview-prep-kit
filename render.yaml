services:
  - type: web
    name: ai-interview-prep-kit-api
    runtime: node
    plan: free
    rootDir: backend
    # Render sets NODE_ENV=production at build time, which makes a plain `npm install`
    # skip devDependencies (typescript, @types/*) that this TypeScript build needs.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: ALLOW_PRIVATE_HOSTS
        value: "false"
      - key: LLM_MAX_CONCURRENCY
        value: "1"
      # Lets Vercel preview deployments (*.vercel.app) call this API. Set to "false" to
      # restrict CORS strictly to the exact origins in CORS_ORIGIN.
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: "true"
